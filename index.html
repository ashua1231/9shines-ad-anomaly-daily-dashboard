<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>9shines label &mdash; Ad Anomaly Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel2:#171c27; --border:#232a38;
    --text:#e6e9ef; --muted:#8b93a5; --accent:#5b8def;
    --red:#ef4444; --redbg:#2a1216; --amber:#f59e0b; --amberbg:#2a2112; --green:#22c55e; --greenbg:#12241a;
    --blue:#38bdf8;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; padding:0;}
  header{background:var(--panel); border-bottom:1px solid var(--border); padding:16px 24px; position:sticky; top:0; z-index:10;}
  .headrow{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  h1{font-size:18px; margin:0; font-weight:600;}
  .sub{color:var(--muted); font-size:12px; margin-top:2px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .chip.crit{background:var(--redbg); color:var(--red); border:1px solid var(--red);}
  .chip.warn{background:var(--amberbg); color:var(--amber); border:1px solid var(--amber);}
  .chip.info{background:#12202a; color:var(--blue); border:1px solid var(--blue);}
  .chip.dep{background:#1a1530; color:#a78bfa; border:1px solid #a78bfa;}
  .updated{color:var(--muted); font-size:11px;}
  nav{display:flex; gap:4px; padding:0 24px; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto;}
  nav button{background:none; border:none; color:var(--muted); padding:12px 18px; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  nav button.active{color:var(--text); border-bottom-color:var(--accent);}
  nav button .badge{background:var(--panel2); border-radius:10px; padding:1px 7px; font-size:11px; margin-left:6px; color:var(--muted);}
  main{padding:24px; max-width:1400px; margin:0 auto;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}
  .section-title{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin:28px 0 12px; font-weight:700;}
  .section-title:first-child{margin-top:0;}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .card.RED{border-color:var(--red); background:linear-gradient(180deg,var(--redbg),var(--panel));}
  .card.AMBER{border-color:var(--amber); background:linear-gradient(180deg,var(--amberbg),var(--panel));}
  .card.GREEN{border-color:var(--border);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;}
  .pill{font-size:10px; padding:2px 8px; border-radius:10px; background:var(--panel2); color:var(--muted); font-weight:600;}
  .rag{font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; letter-spacing:.04em;}
  .rag.RED{background:var(--red); color:#fff;}
  .rag.AMBER{background:var(--amber); color:#1a1200;}
  .rag.GREEN{background:var(--green); color:#04220f;}
  .cname{font-size:13px; font-weight:700; margin-bottom:10px; line-height:1.3; word-break:break-word;}
  .metrics{display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px;}
  .metric-label{color:var(--muted); font-size:10px; text-transform:uppercase;}
  .metric-val{font-weight:700; font-size:13px;}
  .dev-pos{color:var(--green);}
  .dev-neg{color:var(--red);}
  .chart-wrap{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:20px;}
  .charts-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:800px){.charts-row{grid-template-columns:1fr;}}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted); font-size:10px; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .warn-val{color:var(--amber); font-weight:700;}
  .banner{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:24px;}
  .banner-head{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:14px;}
  .chipgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
  .metricchip{background:var(--panel2); border-radius:8px; padding:12px;}
  .metricchip .val{font-size:20px; font-weight:800;}
  .metricchip .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; margin-top:4px;}
  .metricchip .sub{font-size:10px; color:var(--muted); margin-top:2px;}
  .metricchip.good .val{color:var(--green);}
  .metricchip.bad .val{color:var(--red);}
  .alertlist{display:flex; flex-direction:column; gap:8px; max-height:640px; overflow-y:auto;}
  .alertitem{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start;}
  .sevbadge{font-size:10px; font-weight:800; padding:3px 9px; border-radius:6px; white-space:nowrap; margin-top:2px;}
  .sevbadge.CRITICAL{background:var(--red); color:#fff;}
  .sevbadge.WARNING{background:var(--amber); color:#1a1200;}
  .sevbadge.INFO{background:var(--blue); color:#001a24;}
  .alertbody .entity{font-weight:700; font-size:13px;}
  .alertbody .typ{color:var(--muted); font-size:11px; margin:2px 0;}
  .alertbody .detail{font-size:12px; color:#c7cdda;}
  .depcard{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px;}
  .depcard .pat{font-weight:700; font-size:13px; margin-bottom:4px;}
  .actionitem{background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:10px;}
  .actionitem.CRITICAL{border-left-color:var(--red);}
  .actionitem.WARNING{border-left-color:var(--amber);}
  .actionitem.INFO{border-left-color:var(--blue);}
  .actionitem .row{font-size:12px; margin-top:4px;}
  .actionitem .row b{color:var(--muted); font-weight:600; margin-right:4px;}
  .empty{color:var(--muted); font-size:13px; padding:20px; text-align:center;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>
<body>
<header>
  <div class="headrow">
    <div>
      <h1>9shines label &mdash; Ad Anomaly Dashboard</h1>
      <div class="sub">Meta &#183; Google Ads &#183; Shopify &mdash; <span id="reportDate"></span></div>
    </div>
    <div class="chips">
      <div class="chip crit">&#9679; CRITICAL <span id="chipCrit"></span></div>
      <div class="chip warn">&#9679; WARNING <span id="chipWarn"></span></div>
      <div class="chip info">&#9679; INFO <span id="chipInfo"></span></div>
      <div class="chip dep">&#9902; DEPENDENCIES <span id="chipDep"></span></div>
    </div>
    <div class="updated" id="lastUpdated"></div>
  </div>
</header>
<nav>
  <button data-tab="meta" class="active">Meta Ads <span class="badge" id="metaBadge"></span></button>
  <button data-tab="google">Google Ads <span class="badge" id="googleBadge"></span></button>
  <button data-tab="disc">Discrepancies &amp; Dependencies <span class="badge" id="discBadge"></span></button>
  <button data-tab="yday">Yesterday Performance</button>
  <button data-tab="action">Action Items <span class="badge" id="actionBadge"></span></button>
</nav>
<main>
  <div class="tabpanel active" id="tab-meta">
    <div class="section-title">Account Overview</div>
    <div class="cards" id="metaAccountCards"></div>
    <div class="charts-row">
      <div class="chart-wrap"><canvas id="metaRoasChart" height="220"></canvas></div>
      <div class="chart-wrap"><canvas id="metaCpmChart" height="220"></canvas></div>
    </div>
    <div class="section-title">Campaigns</div>
    <div class="cards" id="metaCampaignCards"></div>
  </div>

  <div class="tabpanel" id="tab-google">
    <div class="charts-row">
      <div class="chart-wrap"><canvas id="googleRoasChart" height="220"></canvas></div>
      <div class="chart-wrap"><canvas id="googleCpaChart" height="220"></canvas></div>
    </div>
    <div class="section-title">Campaigns</div>
    <div class="cards" id="googleCampaignCards"></div>
  </div>

  <div class="tabpanel" id="tab-disc">
    <div class="section-title">Compound Patterns &amp; Dependencies</div>
    <div id="depCards"></div>
    <div class="section-title">All Active Alerts</div>
    <div class="alertlist" id="alertList"></div>
  </div>

  <div class="tabpanel" id="tab-yday">
    <div class="banner">
      <div class="banner-head" id="bannerHead"></div>
      <div class="chipgrid" id="bannerChips"></div>
    </div>
    <div class="section-title" id="metaYdayTitle"></div>
    <table><thead><tr><th>Account</th><th>ROAS</th><th>Spend</th><th>Purchases</th><th>CPM</th><th>CTR</th><th>ATC</th><th>Checkouts</th></tr></thead><tbody id="metaYdayTable"></tbody></table>
    <div class="section-title" id="googleYdayTitle"></div>
    <table><thead><tr><th>Account</th><th>ROAS</th><th>Spend</th><th>Conversions</th><th>CPA</th><th>CTR</th></tr></thead><tbody id="googleYdayTable"></tbody></table>
  </div>

  <div class="tabpanel" id="tab-action">
    <div id="actionList"></div>
  </div>
</main>

function fmtINR(v){ if(v===null||v===undefined) return "N/A"; return "&#8377;" + Math.round(v).toLocaleString('en-IN'); }
function fmtNum(v,d){ if(v===null||v===undefined) return "N/A"; return Number(v).toFixed(d===undefined?1:d); }
function devSpan(dev, inverse){
  if(dev===null||dev===undefined) return '<span style="color:var(--muted)">&mdash;</span>';
  let good = inverse ? dev < 0 : dev > 0;
  let cls = good ? 'dev-pos':'dev-neg';
  let arrow = dev>=0 ? '&uarr;':'&darr;';
  return '<span class="'+cls+'">'+arrow+' '+Math.abs(dev).toFixed(1)+'%</span>';
}
function ragBadge(r){ return '<span class="rag '+r+'">'+r+'</span>'; }

// ---- ACTION ITEMS TAB ----
const actionListEl = document.getElementById('actionList');
function actionFor(a){
  let action = "Review campaign performance manually.";
  let outcome = "Restore performance to baseline.";
  const t = a.type.toLowerCase();
  if(t.includes('roas absolute')){ action='Pause or restructure this campaign \u2014 it is spending below breakeven (ROAS < 1.0x).'; outcome='Stop losses; reallocate budget to profitable campaigns.'; }
  else if(t.includes('roas drop >40') || t.includes('conversions drop')){ action='Pause spend increases immediately; check landing page, offer, and pixel/conversion tracking for this campaign.'; outcome='Identify root cause of conversion collapse and restore ROAS toward baseline.'; }
  else if(t.includes('roas drop 20-40') || t.includes('roas drop')){ action='Reduce daily budget by 20-30% and monitor for 48h; review creative fatigue.'; outcome='Prevent further budget waste while performance stabilizes.'; }
  else if(t.includes('cpm spike')){ action='Refresh ad creatives and review audience overlap/saturation.'; outcome='Bring CPM back toward baseline, improving efficiency.'; }
  else if(t.includes('cpa increase')){ action='Tighten targeting or bidding strategy; consider pausing underperforming ad sets.'; outcome='Lower cost per acquisition toward baseline.'; }
  else if(t.includes('spend spike')){ action='Verify budget caps and bidding strategy are set correctly; confirm spend increase is intentional.'; outcome='Avoid unplanned overspend.'; }
  else if(t.includes('zero conversions') || t.includes('tracking')){ action='Verify pixel/conversion tracking is firing correctly; if traffic-objective, confirm this is expected.'; outcome='Ensure conversion data integrity for future optimization.'; }
  else if(t.includes('cross-channel')){ action='Review category-wide demand and seasonality; align creative/promo calendar across Meta and Google.'; outcome='Diagnose whether softness is platform-specific or market-wide.'; }
  return {action, outcome};
}
const grouped = {CRITICAL:[], WARNING:[], INFO:[]};
DATA.alerts.forEach(a=>{ if(grouped[a.severity]) grouped[a.severity].push(a); });
['CRITICAL','WARNING','INFO'].forEach(sev=>{
  if(grouped[sev].length===0) return;
  actionListEl.innerHTML += `<div class="section-title">${sev} (${grouped[sev].length})</div>`;
  grouped[sev].forEach(a=>{
    const {action, outcome} = actionFor(a);
    actionListEl.innerHTML += `<div class="actionitem ${sev}">
      <span class="sevbadge ${sev}">${sev}</span>
      <div class="row"><b>What:</b>${a.type} &mdash; ${a.entity}</div>
      <div class="row"><b>Where:</b>${a.entity}</div>
      <div class="row"><b>Detail:</b>${a.detail}</div>
      <div class="row"><b>Action:</b>${action}</div>
      <div class="row"><b>Expected outcome:</b>${outcome}</div>
    </div>`;
  });
});
if(DATA.alerts.length===0){ actionListEl.innerHTML = '<div class="empty">No action items today \u2014 all clear.</div>'; }
